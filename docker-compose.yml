services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: f2f
      POSTGRES_PASSWORD: f2f
      POSTGRES_DB: f2f
    ports:
      - "5432:5432"
    volumes:
      - f2f_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f2f -d f2f"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://f2f:f2f@db:5432/f2f
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3000
      FARM_TEAM_PHONE: ${FARM_TEAM_PHONE:-+91 90000 00000}
      FARM_TEAM_WHATSAPP: ${FARM_TEAM_WHATSAPP:-919000000000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-this-now}
      SEED_PARTNER_EMAIL: ${SEED_PARTNER_EMAIL:-rider@example.com}
      SEED_PARTNER_PASSWORD: ${SEED_PARTNER_PASSWORD:-change-this-now}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-orders@example.com}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh","-c","alembic upgrade head && python3 -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: ["npm","run","start"]

volumes:
  f2f_pgdata:
