services:
  - type: web
    name: f2f-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerCommand: sh -c "alembic upgrade head && python3 -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: f2f-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_PARTNER_EMAIL
        sync: false
      - key: SEED_PARTNER_PASSWORD
        sync: false
      - key: FARM_TEAM_PHONE
        sync: false
      - key: FARM_TEAM_WHATSAPP
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: f2f-web
    runtime: docker
    region: singapore
    plan: free
    rootDir: frontend
    envVars:
      - key: F2F_BACKEND_URL
        fromService:
          name: f2f-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: f2f-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
